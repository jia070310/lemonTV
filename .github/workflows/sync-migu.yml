name: Sync Migu M3U with Smart Schedule

on:
  schedule:
    # 每30分钟检查一次（可根据需要调整）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（忽略时间检查）'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        id: sync
        run: python .github/scripts/sync_migu.py
        
      - name: Commit and push changes
        if: steps.sync.outputs.should_commit == 'true' || github.event.inputs.force_sync == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加文件
          git add iptv-fe.m3u
          git add .sync-state.json
          
          # 检查是否有变更要提交
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "🔄 同步 migu.m3u: ${{ steps.sync.outputs.sync_time }}"
            git push
            echo "✅ 同步完成并已推送"
          fi
