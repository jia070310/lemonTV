name: Smart Sync MIGU Playlist

on:
  # 每小时检查一次，但根据源文件更新时间决定是否同步
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get source file info
        id: get-info
        run: |
          echo "🔄 Checking source file update time..."
          
          # 方法1：尝试通过GitHub API获取
          echo "Trying GitHub API..."
          API_RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/ioptu/IPTV.txt2m3u.player/commits?path=migu.m3u&per_page=1" || true)
          
          if echo "$API_RESPONSE" | grep -q '"date"'; then
            LAST_COMMIT_TIME=$(echo "$API_RESPONSE" | grep -o '"date":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "✅ Got commit time from API: $LAST_COMMIT_TIME"
          else
            # 方法2：使用文件最后修改时间（通过HTTP头）
            echo "⚠️ API failed, trying HTTP headers..."
            URL="https://github.com/ioptu/IPTV.txt2m3u.player/raw/refs/heads/main/migu.m3u"
            HEADERS=$(curl -s -I "$URL" | grep -i 'last-modified' || true)
            
            if [ -n "$HEADERS" ]; then
              LAST_COMMIT_TIME=$(echo "$HEADERS" | sed 's/Last-Modified: //i' | xargs)
              echo "✅ Got time from HTTP headers: $LAST_COMMIT_TIME"
            else
              # 方法3：使用当前时间作为后备
              LAST_COMMIT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              echo "⚠️ Using current time as fallback: $LAST_COMMIT_TIME"
            fi
          fi
          
          # 保存时间
          echo "last_commit_time=$LAST_COMMIT_TIME" >> $GITHUB_OUTPUT
          
          # 计算是否需要同步
          # 先检查是否有上次同步记录
          if [ -f .last_sync_info ]; then
            source .last_sync_info
            LAST_SYNC_TIME=${LAST_SOURCE_TIME:-"1970-01-01T00:00:00Z"}
          else
            LAST_SYNC_TIME="1970-01-01T00:00:00Z"
          fi
          
          # 时间比较（简单字符串比较，因为GitHub时间总是ISO格式）
          if [[ "$LAST_COMMIT_TIME" > "$LAST_SYNC_TIME" ]]; then
            echo "🔄 Source file updated after last sync"
            echo "should_sync=true" >> $GITHUB_OUTPUT
          else
            # 检查是否已经过了2小时
            CURRENT_TS=$(date +%s)
            if [ -f .last_sync_info ]; then
              LAST_SYNC_TS=$(grep 'LAST_SYNC_TS=' .last_sync_info | cut -d= -f2 || echo "0")
              TIME_DIFF=$((CURRENT_TS - LAST_SYNC_TS))
              
              if [ $TIME_DIFF -ge 7200 ]; then  # 2小时=7200秒
                echo "⏰ 2 hours passed since last sync"
                echo "should_sync=true" >> $GITHUB_OUTPUT
              else
                echo "⏳ Not time yet ($((7200 - TIME_DIFF)) seconds remaining)"
                echo "should_sync=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "📝 First sync needed"
              echo "should_sync=true" >> $GITHUB_OUTPUT
            fi
          fi
          
          # 输出调试信息
          echo "Last sync time: $LAST_SYNC_TIME"
          echo "Source commit time: $LAST_COMMIT_TIME"

      - name: Download and update file
        if: steps.get-info.outputs.should_sync == 'true'
        id: download
        run: |
          echo "⬇️ Downloading source file..."
          curl -s -L "https://github.com/ioptu/IPTV.txt2m3u.player/raw/refs/heads/main/migu.m3u" -o iptv-fe_new.m3u
          
          # 检查文件是否有效
          if [ ! -s iptv-fe_new.m3u ]; then
            echo "❌ Downloaded file is empty!"
            exit 1
          fi
          
          # 检查文件内容是否有效（至少应该有一些内容）
          LINE_COUNT=$(wc -l < iptv-fe_new.m3u)
          echo "📊 New file has $LINE_COUNT lines"
          
          if [ $LINE_COUNT -lt 10 ]; then
            echo "⚠️ Warning: File seems very small ($LINE_COUNT lines)"
          fi
          
          # 比较文件内容
          if [ -f iptv-fe.m3u ] && cmp -s iptv-fe.m3u iptv-fe_new.m3u; then
            echo "✅ Files are identical, no update needed"
            rm iptv-fe_new.m3u
            echo "file_updated=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Files differ, updating..."
            
            # 备份旧文件（可选）
            if [ -f iptv-fe.m3u ]; then
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              cp iptv-fe.m3u "backups/iptv-fe_${TIMESTAMP}.m3u"
              echo "💾 Backup created: backups/iptv-fe_${TIMESTAMP}.m3u"
            fi
            
            # 更新文件
            mv iptv-fe_new.m3u iptv-fe.m3u
            echo "file_updated=true" >> $GITHUB_OUTPUT
            echo "lines_count=$LINE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Update sync info
        if: steps.get-info.outputs.should_sync == 'true' && steps.download.outputs.file_updated == 'true'
        run: |
          echo "📝 Updating sync information..."
          
          CURRENT_TS=$(date +%s)
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # 保存同步信息
          cat > .last_sync_info << EOF
          LAST_SYNC_TIME="$CURRENT_TIME"
          LAST_SOURCE_TIME="${{ steps.get-info.outputs.last_commit_time }}"
          LAST_SYNC_TS="$CURRENT_TS"
          FILE_LINES="${{ steps.download.outputs.lines_count }}"
          SOURCE_URL="https://github.com/ioptu/IPTV.txt2m3u.player/raw/refs/heads/main/migu.m3u"
          EOF
          
          # 也保存为JSON格式（便于阅读）
          cat > sync_info.json << EOF
          {
            "last_sync": "$CURRENT_TIME",
            "last_source_update": "${{ steps.get-info.outputs.last_commit_time }}",
            "file_lines": ${{ steps.download.outputs.lines_count || 0 }},
            "next_check_estimate": "$(date -d '+1 hour' +'%Y-%m-%d %H:%M:%S')",
            "next_sync_estimate": "$(date -d '+2 hours' +'%Y-%m-%d %H:%M:%S')"
          }
          EOF
          
          echo "Sync info updated:"
          cat .last_sync_info
          echo ""
          cat sync_info.json

      - name: Commit and push changes
        if: steps.get-info.outputs.should_sync == 'true' && steps.download.outputs.file_updated == 'true'
        run: |
          echo "💾 Committing changes..."
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加所有可能变化的文件
          git add iptv-fe.m3u
          [ -f .last_sync_info ] && git add .last_sync_info
          [ -f sync_info.json ] && git add sync_info.json
          
          # 创建有意义的提交信息
          COMMIT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          SOURCE_TIME="${{ steps.get-info.outputs.last_commit_time }}"
          LINES="${{ steps.download.outputs.lines_count }}"
          
          git commit -m "🔄 Auto-sync MIGU playlist
          
          • Source updated: $SOURCE_TIME
          • Synced at: $COMMIT_TIME
          • Lines: $LINES
          • Next sync: ~$(date -d '+2 hours' +'%H:%M UTC')
          
          📎 From: ioptu/IPTV.txt2m3u.player"
          
          echo "🚀 Pushing changes..."
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "========================================"
          echo "           Sync Summary"
          echo "========================================"
          
          if [ "${{ steps.get-info.outputs.should_sync }}" = "true" ]; then
            if [ "${{ steps.download.outputs.file_updated }}" = "true" ]; then
              echo "✅ Sync completed successfully"
              echo "📅 Next check: $(date -d '+1 hour' +'%H:%M')"
              echo "🔄 Next sync expected: $(date -d '+2 hours' +'%H:%M')"
            else
              echo "✅ Checked but file was already up-to-date"
            fi
          else
            echo "⏸️  Sync not needed at this time"
            if [ -f .last_sync_info ]; then
              source .last_sync_info
              if [ -n "$LAST_SYNC_TS" ]; then
                CURRENT_TS=$(date +%s)
                TIME_LEFT=$((7200 - (CURRENT_TS - LAST_SYNC_TS)))
                if [ $TIME_LEFT -gt 0 ]; then
                  HOURS=$((TIME_LEFT / 3600))
                  MINUTES=$(((TIME_LEFT % 3600) / 60))
                  echo "⏰ Next sync in about ${HOURS}h ${MINUTES}m"
                fi
              fi
            fi
          fi
          
          echo ""
          echo "📊 File info:"
          if [ -f iptv-fe.m3u ]; then
            echo "- Size: $(wc -l < iptv-fe.m3u) lines"
            echo "- Last modified: $(date -r iptv-fe.m3u +'%Y-%m-%d %H:%M:%S')"
          fi
          echo "========================================"
